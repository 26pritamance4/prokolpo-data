
name: PIP Monitor

on:
  schedule:
    # 00:00 UTC = 05:30 IST, Monday and Thursday.
    # Run starts at 05:30 so the report lands at ~06:00 IST.
    # GitHub cron can drift 5-20 min under load; that is expected.
    - cron: "0 0 * * 1,4"
    # Retry window: 02:00 UTC = 07:30 IST. Runs only if the earlier
    # attempt did not produce a report for today.
    - cron: "0 2 * * 1,4"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pip-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install --quiet requests

      # The 07:30 IST cron is a retry, not a second run.
      - name: Skip retry if the 05:30 run already succeeded
        id: guard
        run: |
          TODAY=$(TZ=Asia/Kolkata date +%F)
          if [ "${{ github.event.schedule }}" = "0 2 * * 1,4" ] && [ -f "reports/$TODAY.json" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Report for $TODAY exists — earlier run succeeded."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run PIP
        if: steps.guard.outputs.skip != 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python scripts/pip.py

      - name: Commit results
        if: steps.guard.outputs.skip != 'true'
        run: |
          git config user.name  "pip-monitor[bot]"
          git config user.email "pip-monitor@users.noreply.github.com"
          git add schemes.json reports/ state/
          if git diff --staged --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "PIP run $(TZ=Asia/Kolkata date +%F)"
            git push
          fi

      # A silent failure at twice-weekly cadence costs a week. Always alert.
      - name: Alert on failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -n "$TELEGRAM_BOT_TOKEN" ]; then
            curl -sS -X POST \
              "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
              -d chat_id="$TELEGRAM_CHAT_ID" \
              -d parse_mode="HTML" \
              -d text="🔴 <b>PIP run FAILED</b>%0A%0AWorkflow errored before completing.%0ANothing was committed.%0A%0A${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          fi
