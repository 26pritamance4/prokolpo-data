name: PIP Monitor

on:
  schedule:
    # 00:00 UTC = 05:30 IST, Monday and Thursday.
    # Run starts at 05:30 so the report lands at ~06:00 IST.
    # GitHub cron can drift 5-20 min under load; that is expected.
    - cron: "0 0 * * 1,4"
    # Retry window: 02:00 UTC = 07:30 IST. Runs only if the earlier
    # attempt did not produce a report for today.
    - cron: "0 2 * * 1,4"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pip-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install --quiet requests

      # The 07:30 IST cron is a retry, not a second run.
      - name: Skip retry if the 05:30 run already succeeded
        id: guard
        run: |
          TODAY=$(TZ=Asia/Kolkata date +%F)
          if [ "${{ github.event.schedule }}" = "0 2 * * 1,4" ] && [ -f "reports/$TODAY.json" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Report for $TODAY exists — earlier run succeeded."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run PIP
        if: steps.guard.outputs.skip != 'true'
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python scripts/pip.py

      - name: Commit results
        if: always() && steps.guard.outputs.skip != 'true'
        run: |
          git config user.name  "pip-monitor[bot]"
          git config user.email "pip-monitor@users.noreply.github.com"
          git add schemes.json reports/ state/
          if git diff --staged --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "PIP run $(TZ=Asia/Kolkata date +%F)"
            git push
          fi

      # Keep the diagnostic report even when the run dies before committing.
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pip-diagnostics
          path: |
            reports/
            state/
          retention-days: 30
          if-no-files-found: ignore
